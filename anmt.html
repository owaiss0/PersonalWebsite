<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: white;
        }
        
        #svgContainer {
            width: 640px;
            height: 512px;
            background-color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #666;
        }
        
        /* Responsive design */
        @media (max-width: 680px) {
            #svgContainer {
                width: 90vw;
                height: auto;
                aspect-ratio: 640/512;
            }
        }
    </style>
</head>
<body>
    <div id="svgContainer" class="loading">Loading animation...</div>

    <!-- Lottie/Bodymovin library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    
    <script>
        // Your animation data should be defined here
        // Replace this with your actual animation data
        const animationData = {
            "v": "5.7.4",
            "fr": 30,
            "ip": 0,
            "op": 60,
            "w": 640,
            "h": 512,
            "nm": "Sample Animation",
            "ddd": 0,
            "assets": [],
            "layers": [
                {
                    "ddd": 0,
                    "ind": 1,
                    "ty": 1,
                    "nm": "Sample Layer",
                    "sr": 1,
                    "ks": {
                        "o": {"a": 0, "k": 100},
                        "r": {"a": 1, "k": [
                            {"i": {"x": [0.833], "y": [0.833]}, "o": {"x": [0.167], "y": [0.167]}, "t": 0, "s": [0]},
                            {"t": 59, "s": [360]}
                        ]},
                        "p": {"a": 0, "k": [320, 256, 0]},
                        "a": {"a": 0, "k": [0, 0, 0]},
                        "s": {"a": 0, "k": [100, 100, 100]}
                    },
                    "ao": 0,
                    "sw": 640,
                    "sh": 512,
                    "sc": "#ff0000",
                    "ip": 0,
                    "op": 60,
                    "st": 0,
                    "bm": 0
                }
            ]
        };

        // Initialize animation when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            const svgContainer = document.getElementById('svgContainer');
            
            // Remove loading text
            svgContainer.classList.remove('loading');
            svgContainer.textContent = '';
            
            try {
                // Load animation with optimized settings
                const animItem = lottie.loadAnimation({
                    container: svgContainer,
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    animationData: animationData,
                    // Performance optimizations
                    rendererSettings: {
                        preserveAspectRatio: 'xMidYMid slice',
                        progressiveLoad: false,
                        hideOnTransparent: true
                    }
                });

                // Optional: Add event listeners for animation control
                animItem.addEventListener('complete', function() {
                    console.log('Animation completed');
                });

                animItem.addEventListener('loopComplete', function() {
                    console.log('Animation loop completed');
                });

                // Error handling
                animItem.addEventListener('error', function(error) {
                    console.error('Animation error:', error);
                    svgContainer.innerHTML = '<p style="text-align: center; color: #ff0000;">Animation failed to load</p>';
                });

            } catch (error) {
                console.error('Failed to initialize animation:', error);
                svgContainer.innerHTML = '<p style="text-align: center; color: #ff0000;">Animation initialization failed</p>';
            }
        });

        // Optional: Pause/resume animation on window focus/blur for performance
        window.addEventListener('blur', function() {
            if (window.animItem) {
                window.animItem.pause();
            }
        });

        window.addEventListener('focus', function() {
            if (window.animItem) {
                window.animItem.play();
            }
        });
    </script>
</body>
</html>
