<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        /* Using a more modern font that fits the theme */
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #121224;
            --text-color: #E0E0E0;
            --accent-color: #39FF14; /* Switched to a more "glitchy" green */
            --ghost-color: #FFF;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 2; /* Ensures content is above the ghost */
            animation: fadeIn 1.5s 0.5s ease-out forwards;
            opacity: 0;
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            margin: 0;
            color: var(--accent-color);
            /* A simpler, less laggy animation */
            animation: text-flicker 4s infinite;
        }

        h2 {
            font-size: 2rem;
            margin: 0.5rem 0 1.5rem;
        }

        p {
            font-size: 1.1rem;
            max-width: 400px;
            margin: 0 auto 2.5rem;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            padding: 12px 24px;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }

        .home-button:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--accent-color);
        }

        /* --- THE FUN PART: THE GHOST --- */
        
        .ghost-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* CRITICAL FIX: This makes the container ignore mouse clicks, so the link below works */
            pointer-events: none;
        }
        
        .ghost {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 120px;
            background: var(--ghost-color);
            border-radius: 50% 50% 0 0;
            animation: float 3s ease-in-out infinite;
            /* The JS will control this part */
            transform: translate(-50%, -50%);
        }

        .ghost-eyes {
            position: absolute;
            width: 100%;
            top: 50px;
            display: flex;
            justify-content: space-around;
        }
        
        .ghost-eyes::before,
        .ghost-eyes::after {
            content: '';
            width: 18px;
            height: 18px;
            background: var(--bg-color);
            border-radius: 50%;
            transition: transform 0.3s ease; /* Eye tracking transition */
        }
        
        .ghost-shadow {
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 80%;
            height: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            transform: translateX(-50%);
            filter: blur(5px);
            animation: float-shadow 3s ease-in-out infinite;
        }
        
        /* --- KEYFRAME ANIMATIONS --- */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(-8px); }
            50% { transform: translateY(8px); }
        }

        @keyframes float-shadow {
             0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(0.9); }
        }
        
        @keyframes text-flicker {
            0%, 19%, 21%, 53%, 55%, 100% {
                text-shadow: 0 0 5px var(--accent-color), 0 0 10px var(--accent-color), 0 0 20px var(--accent-color);
                opacity: 1;
            }
            20%, 54% {
                opacity: 0.7;
                text-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>SYSTEM OFFLINE</h2>
        <p>Our apologies. The entity you are looking for has been misplaced in the space-time continuum.</p>
        <a href="index.html" class="home-button">RETURN TO BASE</a>
    </div>
    
    <div class="ghost-container">
        <div class="ghost" id="ghost">
            <div class="ghost-eyes" id="eyes"></div>
            <div class="ghost-shadow"></div>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT OPTIMIZATIONS ---
        
        // This function limits how often a function can run.
        // It's a "throttle" and is much more efficient than running on every pixel of mouse movement.
        function throttle(func, limit) {
            let inThrottle;
            return function() {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        const ghost = document.getElementById('ghost');
        const eyes = document.getElementById('eyes');
        
        // Use the efficient, throttled function for mouse movement
        document.addEventListener('mousemove', throttle(function(e) {
            // Use requestAnimationFrame for even smoother rendering
            window.requestAnimationFrame(function() {
                // Ghost body movement
                const x = (e.clientX - window.innerWidth / 2) / 20;
                const y = (e.clientY - window.innerHeight / 2) / 20;
                ghost.style.transform = `translate(${x}px, ${y}px)`;
                
                // Ghost eye movement
                const angle = Math.atan2(e.clientY - ghost.getBoundingClientRect().top - 60, e.clientX - ghost.getBoundingClientRect().left - 50);
                const eyeX = Math.cos(angle) * 4;
                const eyeY = Math.sin(angle) * 4;
                eyes.style.transform = `translate(${eyeX}px, ${eyeY}px)`;
            });
        }, 16)); // 16ms is roughly 60 frames per second

    </script>

</body>
</html>
