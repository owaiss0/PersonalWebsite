<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owais</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050505;
            --text: #f5f5f5;
            --muted: #a3a3a3;
            --border: #262626;
            --panel: #101010;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(92vw, 560px);
            text-align: center;
            padding: 40px 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(56px, 15vw, 128px);
            line-height: 0.9;
            letter-spacing: 0;
            text-transform: lowercase;
        }

        p {
            margin: 22px 0 0;
            color: var(--muted);
            font-size: 17px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 32px;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--panel);
            color: var(--text);
            text-decoration: none;
            font-weight: 650;
            transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
        }

        a:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background: #171717;
        }

        a.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #050505;
        }

        a.primary:hover {
            background: #e5e5e5;
        }
    </style>
</head>
<body>
    <main>
        <h1>owais</h1>
        <p>Personal site and workout pages.</p>
        <div class="actions">
            <a class="primary" href="https://github.com/owaiss0" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="workout.html">Old Workout</a>
        </div>
    </main>
</body>
</html>
