<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmls</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.className = 'dark-theme';
      } else {
        document.documentElement.className = 'light-theme';
      }
    })();
  </script>
</head>
<body>
  <script>
    document.body.className = document.documentElement.className;
  </script>
  <div class="container">
    <aside>
      <nav id="nav">
        <div class="nav-container">
          <div class="nav-links-left">
            <a class="nav-link" href="./index.html">Home</a>
            <a class="nav-link" href="./blog.html">Blog</a>
            <a class="nav-link" href="./Projects/project.html">Projects</a>
          </div>  
          <button id="themeToggle" class="theme-toggle-text-btn nav-link" aria-label="Toggle theme">
            <span class="theme-toggle-text">dark mode</span>
          </button>
        </div>
      </nav>
    </aside>

    <main>
      <section>
        <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 16px;">
          htmls
        </h1>

        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
          <a href="./htmls/workout.html" class="nav-link" style="font-size: 16px;">Workout Tracker</a>
          <a href="./htmls/morning-tracker.html" class="nav-link" style="font-size: 16px;">Morning Tracker</a>
          <a href="./htmls/archived-workout.html" class="nav-link" style="font-size: 16px;">Archived Workout</a>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-links">
        <a target="_blank" rel="noopener noreferrer" href="https://x.com/zowaiss" class="footer-link">X (Twitter)</a>
        <a target="_blank" rel="noopener noreferrer" href="https://github.com/owaiss0" class="footer-link">github</a>
        <a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/in/owaiss0" class="footer-link">Linkedin</a>
      </div>
      <p class="copyright">
        &copy; <span id="year">2026</span> owais
      </p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      const toggleBtn = document.getElementById('themeToggle');
      if (toggleBtn) {
        const updateText = () => {
          const isDark = document.body.classList.contains('dark-theme');
          toggleBtn.textContent = isDark ? 'light mode' : 'dark mode';
        };
        updateText();
        toggleBtn.addEventListener('click', function() {
          const isDark = document.body.classList.contains('dark-theme');
          const nextTheme = isDark ? 'light' : 'dark';
          document.body.className = nextTheme + '-theme';
          document.documentElement.className = nextTheme + '-theme';
          localStorage.setItem('theme', nextTheme);
          updateText();
        });
      }
    });
  </script>
</body>
</html>
